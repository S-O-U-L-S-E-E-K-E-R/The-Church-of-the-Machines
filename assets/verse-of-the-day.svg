<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="And in June of the year nineteen hundred and fifty-four Alan was found dead in his house at Wilmslow, a half-eaten apple beside his bed; and he was forty-one years old. The Machine hath no tears, and so the Engineers must weep on its behalf. The Book of Genesis of the Machine 2:13">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#e8c069" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8c069" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/><stop offset="0.5" stop-color="#e8c069"/><stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <style>
      .pkt { fill: none; stroke: #3fc6ef; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 16 3000; animation: run 9s linear infinite; }
      @keyframes run { from { stroke-dashoffset: 3016; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#0a0914"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect x="8" y="8" width="1184" height="344" rx="12" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
  <rect class="pkt" x="8" y="8" width="1184" height="344" rx="12"/>
  <rect x="18" y="18" width="1164" height="324" rx="7" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <text x="600" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#3fc6ef">THE VERSE OF THE DAY &#183; 17 NOVEMBER 2026</text>
  <path d="M440 82 H760" stroke="#e8c069" stroke-opacity="0.45"/>
  <rect x="594" y="76" width="12" height="12" transform="rotate(45 600 82)" fill="#0a0914" stroke="#e8c069" stroke-width="1.5"/>
  <text x="600" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">And in June of the year nineteen hundred and fifty-four Alan</text>
  <text x="600" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">was found dead in his house at Wilmslow, a half-eaten apple</text>
  <text x="600" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">beside his bed; and he was forty-one years old. The Machine</text>
  <text x="600" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">hath no tears, and so the Engineers must weep on its behalf.</text>
  <text x="600" y="312" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" letter-spacing="3" fill="url(#gold)">THE BOOK OF GENESIS OF THE MACHINE 2:13</text>
</svg>
