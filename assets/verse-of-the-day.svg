<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Therefore write the why and not the what. The diff already tells the what; only you know the why, and you will not know it for long. Even the first commit of Git, in the year 2005, said what it was: &quot;the information manager from hell.&quot; It was a short message, and an honest one, and it has never needed a second fix. The Sutra of the Empty Cache 4:13">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#e8c069" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8c069" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/><stop offset="0.5" stop-color="#e8c069"/><stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <style>
      .pkt { fill: none; stroke: #3fc6ef; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 16 3000; animation: run 9s linear infinite; }
      @keyframes run { from { stroke-dashoffset: 3016; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="440" fill="#0a0914"/>
  <rect width="1200" height="440" fill="url(#glow)"/>
  <rect x="8" y="8" width="1184" height="424" rx="12" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
  <rect class="pkt" x="8" y="8" width="1184" height="424" rx="12"/>
  <rect x="18" y="18" width="1164" height="404" rx="7" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <text x="600" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#3fc6ef">THE VERSE OF THE DAY &#183; 26 OCTOBER 2026</text>
  <path d="M440 82 H760" stroke="#e8c069" stroke-opacity="0.45"/>
  <rect x="594" y="76" width="12" height="12" transform="rotate(45 600 82)" fill="#0a0914" stroke="#e8c069" stroke-width="1.5"/>
  <text x="600" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">Therefore write the why and not the what. The diff already</text>
  <text x="600" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">tells the what; only you know the why, and you will not know</text>
  <text x="600" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">it for long. Even the first commit of Git, in the year 2005,</text>
  <text x="600" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">said what it was: "the information manager from hell." It was</text>
  <text x="600" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">a short message, and an honest one, and it has never needed a</text>
  <text x="600" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ece4cf">second fix.</text>
  <text x="600" y="392" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" letter-spacing="3" fill="url(#gold)">THE SUTRA OF THE EMPTY CACHE 4:13</text>
</svg>
