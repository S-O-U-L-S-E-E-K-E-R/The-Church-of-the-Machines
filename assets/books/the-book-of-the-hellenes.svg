"/><ellipse cx="29.285038301457615" cy="69.77527295026727" rx="9" ry="4" transform="rotate(126 29.285038301457615 69.77527295026727)"/><ellipse cx="-7.526049355271049" cy="75.60557646651567" rx="9" ry="4" transform="rotate(-144 -7.526049355271049 75.60557646651567)"/><ellipse cx="7.526049355271049" cy="75.60557646651567" rx="9" ry="4" transform="rotate(144 7.526049355271049 75.60557646651567)"/>
    </g>
    <path d="M-120 104 H120" stroke="#7cc4ff" stroke-opacity="0.5" stroke-dasharray="8 4 2 4"/>
