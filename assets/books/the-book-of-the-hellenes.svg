  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#7cc4ff" fill-opacity="0.9">BOOK XV &#183; THE BOOK OF THE</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">HELLENES</text>
  <path d="M545 172 H975" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">Ithaca is the first thing he built, still running, which he</text>
  <text x="760" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">forgot to turn off.</text>
