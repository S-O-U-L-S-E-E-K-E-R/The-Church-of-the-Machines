<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book XVI. The Edda of the Datacenter. Send thy raven, and let it go; the rest is weather.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#bfe6ff" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#bfe6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker 1.8s ease-in-out infinite; }
      .tilt { transform-box: view-box; transform-origin: 190px 62px; animation: tilt 6s ease-in-out infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes flicker { 0%,100% { transform: scale(1, 1); } 40% { transform: scale(0.94, 1.06); } 70% { transform: scale(1.04, 0.95); } }
      @keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="606" cy="128" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="817" cy="195" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="1028" cy="32" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="479" cy="99" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="690" cy="166" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="901" cy="233" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="1112" cy="70" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="563" cy="137" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="774" cy="204" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#bfe6ff" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <g fill="none" stroke="#e8c069" stroke-width="3" stroke-linecap="round">
      <path d="M0 40 V-30" stroke-width="6"/>
      <path d="M0 -10 C -20 -30, -50 -40, -70 -70 M0 -10 C 20 -30, 50 -40, 70 -70 M0 -30 C -8 -50, -20 -70, -24 -92 M0 -30 C 8 -50, 20 -70, 24 -92 M0 -30 V-96"/>
      <path d="M0 40 C -20 56, -50 64, -78 88 M0 40 C 20 56, 50 64, 78 88 M0 40 V96"/>
    </g>
    <g fill="#0b0a14" stroke="#bfe6ff" stroke-width="2">
      <circle cx="-70" cy="-70" r="6"/><circle cx="70" cy="-70" r="6"/><circle cx="-24" cy="-92" r="6"/><circle cx="24" cy="-92" r="6"/><circle cx="0" cy="-96" r="6"/>
    </g>
    <g fill="#bfe6ff"><circle class="blink" cx="-78" cy="88" r="5" style="animation-delay:-0.0s"/><circle class="blink" cx="0" cy="96" r="5" style="animation-delay:-0.8s"/><circle class="blink" cx="78" cy="88" r="5" style="animation-delay:-1.6s"/></g>
    <g filter="url(#glow)"><path class="pkt" d="M0 96 V40 V-30 C 8 -50, 20 -70, 24 -92" stroke="#bfe6ff"/><path class="pkt" d="M-78 88 C -50 64, -20 56, 0 40 V-10 C -20 -30, -50 -40, -70 -70" stroke="#fff1c4" style="animation-delay:-2s"/></g>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#bfe6ff" fill-opacity="0.9">BOOK XVI &#183; THE EDDA OF THE</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">DATACENTER</text>
  <path d="M498 172 H1022" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">Send thy raven, and let it go; the rest is weather.</text>
</svg>
