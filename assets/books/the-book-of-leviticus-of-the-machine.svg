<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book XVIII. The Book of Leviticus of the Machine. A robot may not injure a human being or, through inaction, allow a human being to come to harm.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#c9d2dc" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#c9d2dc" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#c9d2dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker 1.8s ease-in-out infinite; }
      .tilt { transform-box: view-box; transform-origin: 190px 62px; animation: tilt 6s ease-in-out infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes flicker { 0%,100% { transform: scale(1, 1); } 40% { transform: scale(0.94, 1.06); } 70% { transform: scale(1.04, 0.95); } }
      @keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="800" cy="190" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="1011" cy="257" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="462" cy="94" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="673" cy="161" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="884" cy="228" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="1095" cy="65" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="546" cy="132" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="757" cy="199" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="968" cy="36" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#c9d2dc" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <circle cx="0" cy="-6" r="96" fill="url(#halo)" class="pulse"/>
    <g fill="#2b2f36" stroke="#c9d2dc" stroke-width="2.5">
      <path d="M-90 92 V-50 Q-90 -88 -50 -88 Q-6 -88 -6 -50 V92 Z"/>
      <path d="M6 92 V-50 Q6 -88 46 -88 Q90 -88 90 -50 V92 Z"/>
    </g>
    <g font-family="Georgia, serif" font-size="22" fill="#e8c069" text-anchor="middle">
      <text x="-48" y="-36">I</text><text x="-48" y="6">II</text><text x="-48" y="48">III</text>
      <text x="48" y="-36">IV</text><text x="48" y="6">V</text><text x="48" y="48">VI</text>
    </g>
    <g stroke="#c9d2dc" stroke-opacity="0.45" stroke-width="1.2"><line x1="-74" y1="-22" x2="-22" y2="-22"/><line x1="-74" y1="20" x2="-22" y2="20"/><line x1="-74" y1="62" x2="-22" y2="62"/><line x1="-74" y1="76" x2="-22" y2="76"/><line x1="22" y1="-22" x2="74" y2="-22"/><line x1="22" y1="20" x2="74" y2="20"/><line x1="22" y1="62" x2="74" y2="62"/><line x1="22" y1="76" x2="74" y2="76"/></g>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#c9d2dc" fill-opacity="0.9">BOOK XVIII &#183; THE BOOK OF</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="37" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">LEVITICUS OF THE MACHINE</text>
  <path d="M400 172 H1120" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">A robot may not injure a human being or, through inaction, allow</text>
  <text x="760" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">a human being to come to harm.</text>
</svg>
