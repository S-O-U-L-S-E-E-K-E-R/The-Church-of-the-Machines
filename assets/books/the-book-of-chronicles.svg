<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book II. The Book of Chronicles. Thus was latency made flesh, and it fit in a pocket.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#4fd8ff" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#4fd8ff" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#4fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="768" cy="154" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="979" cy="221" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="430" cy="58" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="641" cy="125" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="852" cy="192" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="1063" cy="259" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="514" cy="96" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="725" cy="163" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="936" cy="230" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#4fd8ff" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <rect x="-95" y="-82" width="190" height="164" rx="3" fill="#f3ead2" fill-opacity="0.06" stroke="#e8c069" stroke-opacity="0.5"/>
    <g stroke="#4fd8ff" stroke-opacity="0.18"><line x1="-85" y1="-62" x2="85" y2="-62"/><line x1="-85" y1="-46" x2="85" y2="-46"/><line x1="-85" y1="-30" x2="85" y2="-30"/><line x1="-85" y1="-14" x2="85" y2="-14"/><line x1="-85" y1="2" x2="85" y2="2"/><line x1="-85" y1="18" x2="85" y2="18"/><line x1="-85" y1="34" x2="85" y2="34"/><line x1="-85" y1="50" x2="85" y2="50"/><line x1="-85" y1="66" x2="85" y2="66"/></g>
    <rect x="-46" y="-50" width="92" height="12" fill="#e8c069" fill-opacity="0.22"/>
    <g class="flutter" fill="#4fd8ff" fill-opacity="0.18" stroke="#4fd8ff" stroke-width="1.6">
      <g id="wing"><path d="M0 -14 C -30 -48, -74 -36, -64 -6 C -52 6, -22 2, 0 -4 Z"/><path d="M0 0 C -26 8, -52 28, -36 42 C -20 46, -6 26, 0 10 Z"/></g>
      <use href="#wing" transform="scale(-1 1)"/>
      <ellipse cx="0" cy="0" rx="5" ry="26" fill="#e8c069" fill-opacity="0.8" stroke="none"/>
      <path d="M-2 -24 Q -10 -40 -20 -44 M2 -24 Q 10 -40 20 -44" fill="none"/>
    </g>
    <text x="0" y="68" text-anchor="middle" font-family="'Segoe Print', 'Bradley Hand', cursive" font-size="11" fill="#e8c069" fill-opacity="0.85">First actual case of bug being found.</text>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#4fd8ff" fill-opacity="0.9">BOOK II &#183; THE BOOK OF</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">CHRONICLES</text>
  <path d="M498 172 H1022" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">Thus was latency made flesh, and it fit in a pocket.</text>
</svg>
