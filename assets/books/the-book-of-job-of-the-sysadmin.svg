<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book III. The Book of Job of the Sysadmin. The vendor gave, and the vendor hath deprecated; blessed be the name of the vendor.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#ff5a5a" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#ff5a5a" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#ff5a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="865" cy="185" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="1076" cy="252" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="527" cy="89" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="738" cy="156" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="949" cy="223" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="400" cy="60" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="611" cy="127" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="822" cy="194" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="1033" cy="31" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#ff5a5a" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <rect x="-62" y="-92" width="124" height="184" rx="6" fill="#0b0a14" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="-50" y="-80" width="100" height="22" rx="2" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
    <path d="M-42 -73 h40 M-42 -67 h40" stroke="#4fd8ff" stroke-opacity="0.3"/>
    <circle class="blink" cx="30" cy="-69" r="3.2" fill="#7dffb0" style="animation-delay:-0.0s"/>
    <circle class="blink" cx="40" cy="-69" r="3.2" fill="#7dffb0" style="animation-delay:-0.0s"/><rect x="-50" y="-52" width="100" height="22" rx="2" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
    <path d="M-42 -45 h40 M-42 -39 h40" stroke="#4fd8ff" stroke-opacity="0.3"/>
    <circle class="blink" cx="30" cy="-41" r="3.2" fill="#7dffb0" style="animation-delay:-0.7s"/>
    <circle class="blink" cx="40" cy="-41" r="3.2" fill="#7dffb0" style="animation-delay:-1.3s"/><rect x="-50" y="-24" width="100" height="22" rx="2" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
    <path d="M-42 -17 h40 M-42 -11 h40" stroke="#4fd8ff" stroke-opacity="0.3"/>
    <circle class="blink" cx="30" cy="-13" r="3.2" fill="#7dffb0" style="animation-delay:-1.4s"/>
    <circle class="blink" cx="40" cy="-13" r="3.2" fill="#7dffb0" style="animation-delay:-2.6s"/><rect x="-50" y="4" width="100" height="22" rx="2" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
    <path d="M-42 11 h40 M-42 17 h40" stroke="#4fd8ff" stroke-opacity="0.3"/>
    <circle class="blink" cx="30" cy="15" r="3.2" fill="#7dffb0" style="animation-delay:-2.1s"/>
    <circle class="blink" cx="40" cy="15" r="3.2" fill="#ff5a5a" style="animation-delay:-3.9s;animation-duration:0.9s"/><rect x="-50" y="32" width="100" height="22" rx="2" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
    <path d="M-42 39 h40 M-42 45 h40" stroke="#4fd8ff" stroke-opacity="0.3"/>
    <circle class="blink" cx="30" cy="43" r="3.2" fill="#7dffb0" style="animation-delay:-2.8s"/>
    <circle class="blink" cx="40" cy="43" r="3.2" fill="#7dffb0" style="animation-delay:-5.2s"/><rect x="-50" y="60" width="100" height="22" rx="2" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
    <path d="M-42 67 h40 M-42 73 h40" stroke="#4fd8ff" stroke-opacity="0.3"/>
    <circle class="blink" cx="30" cy="71" r="3.2" fill="#7dffb0" style="animation-delay:-3.5s"/>
    <circle class="blink" cx="40" cy="71" r="3.2" fill="#7dffb0" style="animation-delay:-6.5s"/>
    <path class="pulse" d="M78 -96 L62 -58 H78 L64 -20" fill="none" stroke="#ff5a5a" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#ff5a5a" fill-opacity="0.9">BOOK III &#183; THE BOOK OF</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="47" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">JOB OF THE SYSADMIN</text>
  <path d="M400 172 H1120" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">The vendor gave, and the vendor hath deprecated; blessed be the</text>
  <text x="760" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">name of the vendor.</text>
</svg>
