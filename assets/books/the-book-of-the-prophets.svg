<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book IV. The Book of the Prophets. Set thine house in order, for the integer is finite.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#b48cff" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="962" cy="216" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="413" cy="53" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="624" cy="120" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="835" cy="187" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="1046" cy="254" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="497" cy="91" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="708" cy="158" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="919" cy="225" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="1130" cy="62" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#b48cff" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <g class="spin" style="animation-duration:90s" stroke="#b48cff" stroke-opacity="0.5" stroke-width="1.4"><line x1="96.0" y1="0.0" x2="112.0" y2="0.0"/><line x1="92.7" y1="24.8" x2="108.2" y2="29.0"/><line x1="83.1" y1="48.0" x2="97.0" y2="56.0"/><line x1="67.9" y1="67.9" x2="79.2" y2="79.2"/><line x1="48.0" y1="83.1" x2="56.0" y2="97.0"/><line x1="24.8" y1="92.7" x2="29.0" y2="108.2"/><line x1="0.0" y1="96.0" x2="0.0" y2="112.0"/><line x1="-24.8" y1="92.7" x2="-29.0" y2="108.2"/><line x1="-48.0" y1="83.1" x2="-56.0" y2="97.0"/><line x1="-67.9" y1="67.9" x2="-79.2" y2="79.2"/><line x1="-83.1" y1="48.0" x2="-97.0" y2="56.0"/><line x1="-92.7" y1="24.8" x2="-108.2" y2="29.0"/><line x1="-96.0" y1="0.0" x2="-112.0" y2="0.0"/><line x1="-92.7" y1="-24.8" x2="-108.2" y2="-29.0"/><line x1="-83.1" y1="-48.0" x2="-97.0" y2="-56.0"/><line x1="-67.9" y1="-67.9" x2="-79.2" y2="-79.2"/><line x1="-48.0" y1="-83.1" x2="-56.0" y2="-97.0"/><line x1="-24.8" y1="-92.7" x2="-29.0" y2="-108.2"/><line x1="-0.0" y1="-96.0" x2="-0.0" y2="-112.0"/><line x1="24.8" y1="-92.7" x2="29.0" y2="-108.2"/><line x1="48.0" y1="-83.1" x2="56.0" y2="-97.0"/><line x1="67.9" y1="-67.9" x2="79.2" y2="-79.2"/><line x1="83.1" y1="-48.0" x2="97.0" y2="-56.0"/><line x1="92.7" y1="-24.8" x2="108.2" y2="-29.0"/></g>
    <path d="M0 -92 L86 62 H-86 Z" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M-50 16 Q0 -28 50 16 Q0 60 -50 16 Z" fill="#0b0a14" stroke="#e8c069" stroke-width="2"/>
    <circle cx="0" cy="16" r="17" fill="none" stroke="#b48cff" stroke-width="2"/>
    <circle class="pulse" cx="0" cy="16" r="7" fill="#b48cff" filter="url(#glow)"/>
    <text x="0" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#b48cff" fill-opacity="0.9">2038-01-19 03:14:07 UTC</text>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#b48cff" fill-opacity="0.9">BOOK IV &#183; THE BOOK OF THE</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">PROPHETS</text>
  <path d="M545 172 H975" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">Set thine house in order, for the integer is finite.</text>
</svg>
