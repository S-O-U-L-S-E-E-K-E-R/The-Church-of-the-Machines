<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book XVII. The Book of Coming Forth by Reboot. Whatsoever cometh forth by reboot shall go in again by reboot; only that which is understood stayeth forth.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#3fd0c0" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#3fd0c0" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#3fd0c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker 1.8s ease-in-out infinite; }
      .tilt { transform-box: view-box; transform-origin: 190px 62px; animation: tilt 6s ease-in-out infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes flicker { 0%,100% { transform: scale(1, 1); } 40% { transform: scale(0.94, 1.06); } 70% { transform: scale(1.04, 0.95); } }
      @keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="703" cy="159" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="914" cy="226" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="1125" cy="63" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="576" cy="130" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="787" cy="197" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="998" cy="34" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="449" cy="101" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="660" cy="168" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="871" cy="235" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#3fd0c0" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <path d="M0 -84 V82 M-34 82 H34" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-88" r="6" fill="#e8c069"/>
    <g class="tilt">
      <path d="M-84 -66 H84" stroke="#e8c069" stroke-width="3" stroke-linecap="round"/>
      <path d="M-84 -66 L-108 -12 M-84 -66 L-60 -12 M84 -66 L60 -12 M84 -66 L108 -12" stroke="#e8c069" stroke-opacity="0.6" stroke-width="1.2"/>
      <path d="M-112 -12 Q-84 8 -56 -12 Z M56 -12 Q84 8 112 -12 Z" fill="#3fd0c0" fill-opacity="0.35" stroke="#e8c069" stroke-width="1.5"/>
      <rect x="-96" y="-38" width="24" height="24" rx="3" fill="#0b0a14" stroke="#3fd0c0" stroke-width="2"/>
      <g stroke="#3fd0c0" stroke-width="1.5"><path d="M-90 -38 v-5 M-90 -14 v5"/><path d="M-84 -38 v-5 M-84 -14 v5"/><path d="M-78 -38 v-5 M-78 -14 v5"/></g>
      <path d="M84 -16 C 78 -30, 80 -48, 92 -58 C 92 -44, 90 -30, 84 -16 Z M84 -16 L 92 -58" fill="#fff1c4" fill-opacity="0.85" stroke="#fff1c4" stroke-width="1"/>
    </g>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#3fd0c0" fill-opacity="0.9">BOOK XVII &#183; THE BOOK OF COMING FORTH BY</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">REBOOT</text>
  <path d="M591 172 H929" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">Whatsoever cometh forth by reboot shall go in again by reboot;</text>
  <text x="760" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">only that which is understood stayeth forth.</text>
</svg>
