<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book XXI. The Book of Numbers. The integer is finite, and so is the token: 2,147,483,647, and not one moth more.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#f2c14e" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#f2c14e" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker 1.8s ease-in-out infinite; }
      .tilt { transform-box: view-box; transform-origin: 190px 62px; animation: tilt 6s ease-in-out infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes flicker { 0%,100% { transform: scale(1, 1); } 40% { transform: scale(0.94, 1.06); } 70% { transform: scale(1.04, 0.95); } }
      @keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="1091" cy="53" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="542" cy="120" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="753" cy="187" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="964" cy="254" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="415" cy="91" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="626" cy="158" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="837" cy="225" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="1048" cy="62" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="499" cy="129" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#f2c14e" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <rect x="-112" y="-40" width="224" height="64" rx="8" fill="#0b0a14" stroke="url(#gold)" stroke-width="2.5"/>
    <g font-family="'Courier New', monospace" font-weight="bold" font-size="22" fill="#e8c069" text-anchor="middle">
      <rect x="-104" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="-95" y="0">2</text><rect x="-83" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="-74" y="0">1</text><rect x="-62" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="-53" y="0">4</text><rect x="-41" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="-32" y="0">7</text><rect x="-20" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="-11" y="0">4</text><rect x="1" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="10" y="0">8</text><rect x="22" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="31" y="0">3</text><rect x="43" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="52" y="0">6</text><rect x="64" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="73" y="0">4</text><rect x="85" y="-30" width="18" height="44" rx="2" fill="#16132a" stroke="#e8c069" stroke-opacity="0.3"/><text x="94" y="0">7</text>
    </g>
    <rect class="blink" x="85" y="-30" width="18" height="44" rx="2" fill="#f2c14e" fill-opacity="0.18"/>
    <text x="0" y="56" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#f2c14e">2^31 - 1</text>
    <text x="0" y="-58" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="4" fill="#e8c069" fill-opacity="0.8">VERSE</text>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#f2c14e" fill-opacity="0.9">BOOK XXI &#183; THE BOOK OF</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">NUMBERS</text>
  <path d="M568 172 H952" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">The integer is finite, and so is the token: 2,147,483,647, and</text>
  <text x="760" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">not one moth more.</text>
</svg>
