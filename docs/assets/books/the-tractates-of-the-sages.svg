<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book XIII. The Tractates of the Sages. The reader seeth not the indent when it is right, and seeth nothing else when it is wrong.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#8fb8ff" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#8fb8ff" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#8fb8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker 1.8s ease-in-out infinite; }
      .tilt { transform-box: view-box; transform-origin: 190px 62px; animation: tilt 6s ease-in-out infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes flicker { 0%,100% { transform: scale(1, 1); } 40% { transform: scale(0.94, 1.06); } 70% { transform: scale(1.04, 0.95); } }
      @keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="1075" cy="35" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="526" cy="102" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="737" cy="169" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="948" cy="236" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="399" cy="73" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="610" cy="140" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="821" cy="207" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="1032" cy="44" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="483" cy="111" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#8fb8ff" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <rect x="-92" y="-90" width="184" height="180" rx="3" fill="#f3ead2" fill-opacity="0.05" stroke="url(#gold)" stroke-width="2"/>
    <rect x="-40" y="-56" width="80" height="80" fill="none" stroke="#8fb8ff" stroke-opacity="0.8"/>
    <g stroke="#e8c069" stroke-opacity="0.85" stroke-width="2"><line x1="-32" y1="-46" x2="32" y2="-46"/><line x1="-32" y1="-36" x2="32" y2="-36"/><line x1="-32" y1="-26" x2="32" y2="-26"/><line x1="-32" y1="-16" x2="32" y2="-16"/><line x1="-32" y1="-6" x2="32" y2="-6"/><line x1="-32" y1="4" x2="32" y2="4"/><line x1="-32" y1="14" x2="32" y2="14"/></g>
    <g stroke="#8fb8ff" stroke-opacity="0.45" stroke-width="1.2">
      <line x1="-84" y1="-80" x2="-48" y2="-80"/><line x1="48" y1="-80" x2="84" y2="-80"/><line x1="-84" y1="-73" x2="-48" y2="-73"/><line x1="48" y1="-73" x2="84" y2="-73"/><line x1="-84" y1="-66" x2="-48" y2="-66"/><line x1="48" y1="-66" x2="84" y2="-66"/><line x1="-84" y1="-59" x2="-48" y2="-59"/><line x1="48" y1="-59" x2="84" y2="-59"/><line x1="-84" y1="-52" x2="-48" y2="-52"/><line x1="48" y1="-52" x2="84" y2="-52"/><line x1="-84" y1="-45" x2="-48" y2="-45"/><line x1="48" y1="-45" x2="84" y2="-45"/><line x1="-84" y1="-38" x2="-48" y2="-38"/><line x1="48" y1="-38" x2="84" y2="-38"/><line x1="-84" y1="-31" x2="-48" y2="-31"/><line x1="48" y1="-31" x2="84" y2="-31"/><line x1="-84" y1="-24" x2="-48" y2="-24"/><line x1="48" y1="-24" x2="84" y2="-24"/><line x1="-84" y1="-17" x2="-48" y2="-17"/><line x1="48" y1="-17" x2="84" y2="-17"/><line x1="-84" y1="-10" x2="-48" y2="-10"/><line x1="48" y1="-10" x2="84" y2="-10"/><line x1="-84" y1="-3" x2="-48" y2="-3"/><line x1="48" y1="-3" x2="84" y2="-3"/><line x1="-84" y1="4" x2="-48" y2="4"/><line x1="48" y1="4" x2="84" y2="4"/><line x1="-84" y1="11" x2="-48" y2="11"/><line x1="48" y1="11" x2="84" y2="11"/><line x1="-84" y1="18" x2="-48" y2="18"/><line x1="48" y1="18" x2="84" y2="18"/><line x1="-84" y1="25" x2="-48" y2="25"/><line x1="48" y1="25" x2="84" y2="25"/><line x1="-84" y1="32" x2="-48" y2="32"/><line x1="48" y1="32" x2="84" y2="32"/><line x1="-84" y1="39" x2="-48" y2="39"/><line x1="48" y1="39" x2="84" y2="39"/><line x1="-84" y1="46" x2="-48" y2="46"/><line x1="48" y1="46" x2="84" y2="46"/><line x1="-84" y1="53" x2="-48" y2="53"/><line x1="48" y1="53" x2="84" y2="53"/><line x1="-84" y1="60" x2="-48" y2="60"/><line x1="48" y1="60" x2="84" y2="60"/><line x1="-84" y1="67" x2="-48" y2="67"/><line x1="48" y1="67" x2="84" y2="67"/><line x1="-84" y1="74" x2="-48" y2="74"/><line x1="48" y1="74" x2="84" y2="74"/><line x1="-84" y1="81" x2="-48" y2="81"/><line x1="48" y1="81" x2="84" y2="81"/>
      <line x1="-40" y1="-82" x2="40" y2="-82"/><line x1="-40" y1="-75" x2="40" y2="-75"/><line x1="-40" y1="-68" x2="40" y2="-68"/><line x1="-40" y1="-61" x2="40" y2="-61"/><line x1="-40" y1="32" x2="40" y2="32"/><line x1="-40" y1="39" x2="40" y2="39"/><line x1="-40" y1="46" x2="40" y2="46"/><line x1="-40" y1="53" x2="40" y2="53"/><line x1="-40" y1="60" x2="40" y2="60"/><line x1="-40" y1="67" x2="40" y2="67"/><line x1="-40" y1="74" x2="40" y2="74"/><line x1="-40" y1="81" x2="40" y2="81"/>
    </g>
    <text x="0" y="-62" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="2" fill="#e8c069">TABS</text>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#8fb8ff" fill-opacity="0.9">BOOK XIII &#183; THE TRACTATES OF THE</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">SAGES</text>
  <path d="M614 172 H906" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">The reader seeth not the indent when it is right, and seeth</text>
  <text x="760" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">nothing else when it is wrong.</text>
</svg>
