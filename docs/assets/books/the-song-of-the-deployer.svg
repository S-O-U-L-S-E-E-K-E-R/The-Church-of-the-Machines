<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Book IX. The Song of the Deployer. Act, but keep a rollback.">
  <defs>
    <radialGradient id="sky" cx="16%" cy="50%" r="95%">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.26"/>
      <stop offset="0.25" stop-color="#ffb347" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0a940" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e8c069"/>
      <stop offset="1" stop-color="#a8792a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
      .rev { animation-direction: reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
      .flutter { transform-box: fill-box; transform-origin: center; animation: flutter 3.2s ease-in-out infinite; }
      .pkt { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 400; animation: run 4.5s linear infinite; }
      .trace { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 900; animation: trace 7s linear infinite; }
      .flicker { transform-box: fill-box; transform-origin: bottom; animation: flicker 1.8s ease-in-out infinite; }
      .tilt { transform-box: view-box; transform-origin: 190px 62px; animation: tilt 6s ease-in-out infinite; }
      .star { fill: #fff3d0; animation: pulse 3s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
      @keyframes flutter { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
      @keyframes flicker { 0%,100% { transform: scale(1, 1); } 40% { transform: scale(0.94, 1.06); } 70% { transform: scale(1.04, 0.95); } }
      @keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
      @keyframes run { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
      @keyframes trace { from { stroke-dashoffset: 914; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0a0914"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect x="8" y="8" width="1184" height="284" rx="10" fill="none" stroke="#e8c069" stroke-opacity="0.35"/>
  <rect x="16" y="16" width="1168" height="268" rx="6" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
  <circle class="star" cx="687" cy="141" r="0.8" style="animation-delay:-0.0s"/>
  <circle class="star" cx="898" cy="208" r="1.1" style="animation-delay:-0.7s"/>
  <circle class="star" cx="1109" cy="45" r="1.4" style="animation-delay:-1.4s"/>
  <circle class="star" cx="560" cy="112" r="0.8" style="animation-delay:-2.1s"/>
  <circle class="star" cx="771" cy="179" r="1.1" style="animation-delay:-2.8s"/>
  <circle class="star" cx="982" cy="246" r="1.4" style="animation-delay:-3.5s"/>
  <circle class="star" cx="433" cy="83" r="0.8" style="animation-delay:-4.2s"/>
  <circle class="star" cx="644" cy="150" r="1.1" style="animation-delay:-4.9s"/>
  <circle class="star" cx="855" cy="217" r="1.4" style="animation-delay:-5.6s"/>

  <path d="M360 262 H1160" stroke="#e8c069" stroke-opacity="0.25"/>
  <path class="trace" d="M360 262 H1160" stroke="#ffb347" filter="url(#glow)"/>

  <g transform="translate(190 150)">
    <g class="spin" style="animation-duration:14s">
      <circle cx="0" cy="0" r="84" fill="none" stroke="url(#gold)" stroke-width="5"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#e8c069" stroke-opacity="0.5" stroke-width="1.5"/>
      <g stroke="#e8c069" stroke-width="3"><line x1="16.0" y1="0.0" x2="72.0" y2="0.0"/><line x1="13.9" y1="8.0" x2="62.4" y2="36.0"/><line x1="8.0" y1="13.9" x2="36.0" y2="62.4"/><line x1="0.0" y1="16.0" x2="0.0" y2="72.0"/><line x1="-8.0" y1="13.9" x2="-36.0" y2="62.4"/><line x1="-13.9" y1="8.0" x2="-62.4" y2="36.0"/><line x1="-16.0" y1="0.0" x2="-72.0" y2="0.0"/><line x1="-13.9" y1="-8.0" x2="-62.4" y2="-36.0"/><line x1="-8.0" y1="-13.9" x2="-36.0" y2="-62.4"/><line x1="-0.0" y1="-16.0" x2="-0.0" y2="-72.0"/><line x1="8.0" y1="-13.9" x2="36.0" y2="-62.4"/><line x1="13.9" y1="-8.0" x2="62.4" y2="-36.0"/></g>
      <g stroke="#ffb347" stroke-width="2"><line x1="84.0" y1="0.0" x2="94.0" y2="0.0"/><line x1="81.1" y1="21.7" x2="90.8" y2="24.3"/><line x1="72.7" y1="42.0" x2="81.4" y2="47.0"/><line x1="59.4" y1="59.4" x2="66.5" y2="66.5"/><line x1="42.0" y1="72.7" x2="47.0" y2="81.4"/><line x1="21.7" y1="81.1" x2="24.3" y2="90.8"/><line x1="0.0" y1="84.0" x2="0.0" y2="94.0"/><line x1="-21.7" y1="81.1" x2="-24.3" y2="90.8"/><line x1="-42.0" y1="72.7" x2="-47.0" y2="81.4"/><line x1="-59.4" y1="59.4" x2="-66.5" y2="66.5"/><line x1="-72.7" y1="42.0" x2="-81.4" y2="47.0"/><line x1="-81.1" y1="21.7" x2="-90.8" y2="24.3"/><line x1="-84.0" y1="0.0" x2="-94.0" y2="0.0"/><line x1="-81.1" y1="-21.7" x2="-90.8" y2="-24.3"/><line x1="-72.7" y1="-42.0" x2="-81.4" y2="-47.0"/><line x1="-59.4" y1="-59.4" x2="-66.5" y2="-66.5"/><line x1="-42.0" y1="-72.7" x2="-47.0" y2="-81.4"/><line x1="-21.7" y1="-81.1" x2="-24.3" y2="-90.8"/><line x1="-0.0" y1="-84.0" x2="-0.0" y2="-94.0"/><line x1="21.7" y1="-81.1" x2="24.3" y2="-90.8"/><line x1="42.0" y1="-72.7" x2="47.0" y2="-81.4"/><line x1="59.4" y1="-59.4" x2="66.5" y2="-66.5"/><line x1="72.7" y1="-42.0" x2="81.4" y2="-47.0"/><line x1="81.1" y1="-21.7" x2="90.8" y2="-24.3"/></g>
      <circle cx="0" cy="0" r="16" fill="#0b0a14" stroke="#ffb347" stroke-width="3"/>
    </g>
    <path class="pulse" d="M-120 102 H120" stroke="#ffb347" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <text x="760" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#ffb347" fill-opacity="0.9">BOOK IX &#183; THE SONG OF THE</text>
  <text x="760" y="150" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="4" fill="url(#gold)" filter="url(#glow)">DEPLOYER</text>
  <path d="M545 172 H975" stroke="#e8c069" stroke-opacity="0.5"/>
  <circle cx="760" cy="172" r="3" fill="#e8c069"/>
  <text x="760" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#cfd8ff" fill-opacity="0.85">Act, but keep a rollback.</text>
</svg>
