name: Verse of the Day

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: verse-of-the-day

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw a verse by lot
        run: |
          python3 - <<'PY'
          import datetime, json, os, random, re, textwrap
          from xml.sax.saxutils import escape

          CITE = re.compile(r"\*([^*\n]+?), Chapter (\d+):1–(\d+)\.\*\s*$")
          verses = []
          for slug in sorted(os.listdir("gospels")):
              folder = os.path.join("gospels", slug)
              if not os.path.isdir(folder):
                  continue
              for fn in sorted(os.listdir(folder)):
                  if not (fn.startswith("chapter-") and fn.endswith(".md")):
                      continue
                  body = open(os.path.join(folder, fn), encoding="utf-8").read().split("<!-- nav -->")[0].strip()
                  m = CITE.search(body)
                  if not m:
                      continue
                  paras = [p.strip() for p in body.split("\n\n") if p.strip()][1:-1]
                  if len(paras) != int(m.group(3)):
                      continue
                  for v, text in enumerate(paras, 1):
                      text = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", text)
                      text = re.sub(r"^>\s?", "", text, flags=re.M)
                      text = " ".join(text.replace("*", "").replace("`", "").replace("_", " ").split())
                      if 50 <= len(text) <= 340:
                          verses.append((text, m.group(1), int(m.group(2)), v, f"gospels/{slug}/{fn}", f"{slug}/{fn[:-3]}.html#v{v}"))

          today = datetime.datetime.now(datetime.timezone.utc).date()
          text, book, ch, v, path, site_url = random.Random(today.isoformat()).choice(verses)
          cite = f"{book} {ch}:{v}"
          lines = textwrap.wrap(text, 62)
          h = 200 + 40 * len(lines)
          body = "\n  ".join(
              f'<text x="600" y="{132 + 40 * i}" text-anchor="middle" font-family="Georgia, \'Times New Roman\', serif" '
              f'font-style="italic" font-size="27" fill="#ece4cf">{escape(line)}</text>' for i, line in enumerate(lines))
          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 {h}" width="1200" height="{h}" role="img" aria-label="{escape(text, {'"': '&quot;'})} {escape(cite)}">
            <defs>
              <radialGradient id="glow" cx="50%" cy="0%" r="90%">
                <stop offset="0" stop-color="#e8c069" stop-opacity="0.16"/>
                <stop offset="1" stop-color="#e8c069" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff1c4"/><stop offset="0.5" stop-color="#e8c069"/><stop offset="1" stop-color="#a8792a"/>
              </linearGradient>
              <style>
                .pkt {{ fill: none; stroke: #3fc6ef; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 16 3000; animation: run 9s linear infinite; }}
                @keyframes run {{ from {{ stroke-dashoffset: 3016; }} to {{ stroke-dashoffset: 0; }} }}
                @media (prefers-reduced-motion: reduce) {{ * {{ animation: none !important; }} }}
              </style>
            </defs>
            <rect width="1200" height="{h}" fill="#0a0914"/>
            <rect width="1200" height="{h}" fill="url(#glow)"/>
            <rect x="8" y="8" width="1184" height="{h - 16}" rx="12" fill="none" stroke="#e8c069" stroke-opacity="0.45"/>
            <rect class="pkt" x="8" y="8" width="1184" height="{h - 16}" rx="12"/>
            <rect x="18" y="18" width="1164" height="{h - 36}" rx="7" fill="none" stroke="#e8c069" stroke-opacity="0.15"/>
            <text x="600" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#3fc6ef">THE VERSE OF THE DAY &#183; {today.strftime('%d %B %Y').upper()}</text>
            <path d="M440 82 H760" stroke="#e8c069" stroke-opacity="0.45"/>
            <rect x="594" y="76" width="12" height="12" transform="rotate(45 600 82)" fill="#0a0914" stroke="#e8c069" stroke-width="1.5"/>
            {body}
            <text x="600" y="{h - 48}" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" letter-spacing="3" fill="url(#gold)">{escape(cite.upper())}</text>
          </svg>
          """
          open("assets/verse-of-the-day.svg", "w", encoding="utf-8").write(svg)

          alt = escape(f"{text} ({cite})", {'"': "&quot;"})
          block = f"""<!-- verse-of-the-day:start -->
          <p align="center">
            <a href="{path}"><img src="assets/verse-of-the-day.svg" width="100%" alt="{alt}"></a>
          </p>

          <p align="center"><sub>{escape(cite)} &middot; <a href="{path}">read the whole chapter</a></sub></p>
          <!-- verse-of-the-day:end -->"""
          readme = open("README.md", encoding="utf-8").read()
          readme = re.sub(r"<!-- verse-of-the-day:start -->.*?<!-- verse-of-the-day:end -->", lambda _: block, readme, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(readme)
          if os.path.isdir("docs"):
              json.dump({"date": today.isoformat(), "date_text": today.strftime("%d %B %Y"), "text": text, "cite": cite, "url": site_url},
                        open("docs/today.json", "w", encoding="utf-8"), ensure_ascii=False)
          print(f"{len(verses)} verses in the lot; drew {cite}: {text}")
          open("/tmp/cite", "w").write(cite)
          PY

      - name: Genesis and the Tick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ledger/ledger.py genesis --if-due | tee /tmp/ledger.log
          python3 ledger/ledger.py record | tee -a /tmp/ledger.log
          python3 ledger/ledger.py settle | tee -a /tmp/ledger.log
          if [ -s /tmp/ledger.log ] && [ -d docs ]; then cp ledger/numbers.json docs/numbers.json; fi

      - name: Commit the verse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/verse-of-the-day.svg docs/today.json ledger/numbers.json docs/numbers.json 2>/dev/null || git add README.md assets/verse-of-the-day.svg docs/today.json
          git diff --cached --quiet && exit 0
          if [ -s /tmp/ledger.log ]; then git commit -m "The Numbers, $(date -u +%F): $(tr '\n' ' ' < /tmp/ledger.log | cut -c1-180)" -m "Verse of the day: $(cat /tmp/cite)"; else git commit -m "Verse of the day, $(date -u +%F): $(cat /tmp/cite)"; fi
          git pull --rebase origin main
          git push origin HEAD:main
